name: Publish Friends Release

on:
  push:
    tags:
      - 'friends-v*'

permissions:
  contents: read

concurrency:
  group: friends-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Download stable Dalamud references
        shell: pwsh
        run: |
          $info = Invoke-RestMethod 'https://kamori.goats.dev/Dalamud/Release/VersionInfo'
          if ([version]$info.assemblyVersion -lt [version]'15.0' -or [version]$info.assemblyVersion -ge [version]'16.0') {
            throw 'The stable Dalamud distribution must use API 15.'
          }
          $zip = Join-Path $env:RUNNER_TEMP 'dalamud.zip'
          $dalamudPath = Join-Path $env:RUNNER_TEMP 'dalamud'
          Invoke-WebRequest -Uri $info.downloadUrl -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $dalamudPath
          "DALAMUD_HOME=$dalamudPath" >> $env:GITHUB_ENV
      - name: Build and test
        shell: pwsh
        run: |
          dotnet build XivForays.Plugin.sln -c Release -p:Platform=x64 -p:RestoreLockedMode=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test XivForays.Plugin.sln -c Release -p:Platform=x64 --no-build --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare package and repository listing
        shell: pwsh
        run: |
          ./.github/scripts/New-FriendsRelease.ps1 -Tag $env:GITHUB_REF_NAME -Repository $env:GITHUB_REPOSITORY `
            -Package 'XivForays.Plugin/bin/x64/Release/XivForays.Plugin/latest.zip' `
            -OutputDirectory "$env:RUNNER_TEMP/friends-release"
      - uses: actions/upload-artifact@v7
        with:
          name: friends-release
          path: ${{ runner.temp }}/friends-release
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: friends-release
          path: friends-release
      - name: Publish GitHub release and make it current
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if draft=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft); then
            if [[ "$draft" != true ]]; then
              echo "This release has already been published."
              exit 0
            fi
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
              --title "XivMate Foray Data Gathering ${GITHUB_REF_NAME#friends-v}" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            friends-release/XivForays.Plugin.zip friends-release/repo.json
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
